<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f3ed"><title>study_wallstreet · 문장 읽기</title><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body>
<header><a href="./" class="brand">study_wallstreet<span>ENGLISH READING ROOM</span></a><label class="article-picker">학습 자료<select id="articles" aria-label="학습 자료 선택" disabled><option>자료 불러오는 중</option></select></label></header>
<main><div class="eyebrow">READ · LISTEN · UNDERSTAND</div><h1 id="title">문장을 불러오고 있습니다.</h1><p id="subtitle"></p><div class="reading-meta"><span id="count"></span><span>문장을 누르면 해당 위치부터 순서대로 읽습니다.</span></div><div id="sentences" aria-label="영어 문장과 한국어 해석"></div><p id="error" role="alert"></p></main>
<footer aria-label="재생 설정"><div class="controls"><div class="transport"><button id="play" class="primary" aria-label="재생" disabled>▶</button><button id="stop" aria-label="정지하고 처음으로" title="정지하고 처음으로" disabled>■</button></div><div class="options"><button id="all" class="repeat" aria-pressed="true" aria-label="전체 반복" title="전체 반복"><span>All</span><b aria-hidden="true">⟳</b></button><button id="one" class="repeat" aria-pressed="false" aria-label="한 문장 반복" title="한 문장 반복"><span>1</span><b aria-hidden="true">⟳</b></button><button id="translation" aria-pressed="true" aria-label="해석 표시" title="해석 표시"><span class="translate-icon" aria-hidden="true">A<span>가</span></span></button></div><label class="speed">재생 속도 <output id="rateValue">1.0×</output><input id="rate" aria-label="재생 속도" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><p id="status" role="status" aria-live="polite">자료를 불러오는 중입니다.</p></footer>
</body></html>
